name: Production health

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-get-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check public shell and headers without user data
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://fourat.dev/rentaloc' }}
          HEALTH_PROFILE: ${{ vars.PRODUCTION_HEALTH_PROFILE || 'github-pages' }}
        run: sh scripts/check-deployment-health.sh "$PRODUCTION_URL" "$HEALTH_PROFILE"
