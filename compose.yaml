services:
  rentaloc:
    build:
      context: .
      args:
        BUILD_REVISION: ${BUILD_REVISION:-local}
    image: rentaloc:${IMAGE_TAG:-local}
    ports:
      - "${RENTALOC_PORT:-8000}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
